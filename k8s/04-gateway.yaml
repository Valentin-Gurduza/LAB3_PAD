apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: pad-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: warehouse-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CONSUL_HOST
              value: "consul"
            - name: CONSUL_PORT
              value: "8500"
            - name: REDIS_CONNECTION
              value: "redis:6379"
            - name: CACHE_TTL_SECONDS
              value: "30"
            - name: GATEWAY_MAX_CONCURRENT
              value: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: pad-lab3
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
