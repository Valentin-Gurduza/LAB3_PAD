---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-rs-init
  namespace: pad-lab3
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command:
            - bash
            - -c
            - |
              for i in 0 1 2; do
                h0="mongo-rs${i}-0.mongo-rs${i}.pad-lab3.svc.cluster.local:27017"
                h1="mongo-rs${i}-1.mongo-rs${i}.pad-lab3.svc.cluster.local:27017"
                h2="mongo-rs${i}-2.mongo-rs${i}.pad-lab3.svc.cluster.local:27017"
                until mongosh --quiet --host "$h0" --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 2; done
                until mongosh --quiet --host "$h1" --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 2; done
                until mongosh --quiet --host "$h2" --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 2; done
                mongosh --quiet --host "$h0" --eval "try { rs.status() } catch(e) { rs.initiate({_id:'rs${i}', settings:{electionTimeoutMillis:2000}, members:[{_id:0,host:'$h0',priority:2},{_id:1,host:'$h1',priority:1},{_id:2,host:'$h2',priority:1}]}) }"
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-ui-shard0
  namespace: pad-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-ui-shard0
  template:
    metadata:
      labels:
        app: mongo-ui-shard0
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2-20
          env:
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://mongo-rs0-0.mongo-rs0:27017,mongo-rs0-1.mongo-rs0:27017,mongo-rs0-2.mongo-rs0:27017/?replicaSet=rs0"
            - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
              value: "true"
            - name: ME_CONFIG_BASICAUTH
              value: "false"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-ui-shard0
  namespace: pad-lab3
spec:
  type: NodePort
  selector:
    app: mongo-ui-shard0
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
