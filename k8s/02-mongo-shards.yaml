apiVersion: v1
kind: Service
metadata:
  name: mongo-rs0
  namespace: pad-lab3
spec:
  clusterIP: None
  selector:
    app: mongo-rs0
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-rs0
  namespace: pad-lab3
spec:
  serviceName: mongo-rs0
  replicas: 3
  selector:
    matchLabels:
      app: mongo-rs0
  template:
    metadata:
      labels:
        app: mongo-rs0
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
          ports:
            - containerPort: 27017
---
