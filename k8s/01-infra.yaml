apiVersion: v1
kind: Namespace
metadata:
  name: pad-lab3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: pad-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.15
          args: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0"]
          ports:
            - containerPort: 8500
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: pad-lab3
spec:
  type: NodePort
  selector:
    app: consul
  ports:
    - port: 8500
      targetPort: 8500
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pad-lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pad-lab3
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
